<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7f8;color:#1f2d36;font-family:"Apple SD Gothic Neo","Pretendard","Noto Sans KR",system-ui,sans-serif}.panel{padding:24px;border-radius:10px;background:#ffffff;border:1px solid #d8e1e7}.eyebrow{color:#187263;font-size:12px;letter-spacing:0;font-weight:600}.head{display:flex;justify-content:space-between;align-items:center;gap:20px}h2{font-size:22px;margin:8px 0}.controls{display:flex;align-items:center;gap:10px;margin:17px 0}button,select{font:inherit;padding:9px 14px;border-radius:6px;border:1px solid #c9d6de;background:#ffffff;color:#173a44;cursor:pointer}#play{background:#187263;color:#ffffff;border:0;font-weight:700}.time{margin-left:auto;font-size:25px;font-weight:700}svg{width:100%;display:block;background:#f5f7f8;border:1px solid #e1e8ed;border-radius:10px}svg text{font-family:inherit;fill:#5f7481;font-size:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}.card{border:1px solid #e1e8ed;padding:16px;border-radius:10px;background:#f5f7f8}.label{font-size:12px;color:#5f7481}.val{font-size:25px;font-weight:750;margin-top:8px}.key{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px}#range{width:100%;accent-color:#187263;margin:18px 0 7px}.legend{font-size:12px;display:flex;gap:22px}.note{font-size:12px;color:#5f7481;line-height:1.7}.decision{border-left:3px solid #1f8f7a;padding:12px;background:#e3f3ee;border-radius:5px;font-size:14px;line-height:1.6}button:focus-visible,input:focus-visible{outline:3px solid #187263}@media(max-width:600px){.panel{padding:15px}.val{font-size:19px}.card{padding:10px}h2{font-size:18px}}
</style><main class="panel"><div class="eyebrow">같은 시각 비교 재생</div><div class="head"><h2 id="title"></h2><span id="date" class="note"></span></div>
<div class="controls"><button id="play" aria-label="비교 재생">▶ 비교 재생</button><button id="prev" aria-label="이전 시각">‹</button><button id="next" aria-label="다음 시각">›</button><select id="speed" aria-label="속도"><option value="1300">보통</option><option value="500" selected>빠르게</option><option value="2500">천천히</option></select><output class="time" id="time"></output></div>
<div class="legend"><span><i class="key" style="background:#1f8f7a"></i><span id="fl"></span></span><span><i class="key" style="background:#c99a1a"></i><span id="al"></span></span></div>
<svg viewBox="0 0 900 270" role="img" aria-label="시간에 따라 예측과 비교 값을 재생하는 그래프"><g id="grid"></g><path id="fb" fill="none" stroke="#1f8f7a" opacity=".17" stroke-width="3"/><path id="ab" fill="none" stroke="#c99a1a" opacity=".17" stroke-width="3"/><path id="fp" fill="none" stroke="#1f8f7a" stroke-width="3"/><path id="ap" fill="none" stroke="#c99a1a" stroke-width="3"/><line id="cursor" y1="25" y2="230" stroke="#5f7481" stroke-dasharray="4 5"/><circle id="fc" r="6" fill="#1f8f7a"/><circle id="ac" r="6" fill="#c99a1a"/></svg>
<input id="range" type="range" min="0" max="23" value="0" aria-label="비교 시간 이동">
<div class="stats"><div class="card"><div class="label" id="fLabel"></div><div class="val" id="fv"></div></div><div class="card"><div class="label" id="aLabel"></div><div class="val" id="av"></div></div><div class="card"><div class="label" id="deltaLabel"></div><div class="val" id="dv"></div></div></div>
<div id="decision" class="decision"></div><p id="note" class="note"></p></main>
<script id="payload" type="application/json">__SIGNAL_DATA__</script><script>
const data=JSON.parse(document.getElementById('payload').textContent),$=id=>document.getElementById(id);let at=0,timer=null;
const rows=data.rows,values=rows.flatMap(x=>[x.f,x.a]).filter(Number.isFinite);const low=Math.min(0,...values),hi=Math.max(1,...values),span=hi-low;
const x=i=>65+i*790/Math.max(1,rows.length-1),y=v=>225-(v-low)*185/span;const fmt=n=>n.toLocaleString('ko-KR',{maximumFractionDigits:2});
const path=(key,end)=>rows.slice(0,end+1).map((r,i)=>(i?'L':'M')+x(i)+','+y(r[key])).join(' ');
$('title').textContent=data.title;$('date').textContent=data.day;$('fl').textContent=$('fLabel').textContent=data.forecastLabel;$('al').textContent=$('aLabel').textContent=data.actualLabel;$('deltaLabel').textContent=data.deltaLabel;$('note').textContent=data.note;$('range').max=rows.length-1;
$('fb').setAttribute('d',path('f',rows.length-1));$('ab').setAttribute('d',path('a',rows.length-1));
for(let j=0;j<5;j++){let v=low+span*j/4;let ns='http://www.w3.org/2000/svg';let line=document.createElementNS(ns,'line');for(let [k,val] of Object.entries({x1:65,x2:855,y1:y(v),y2:y(v),stroke:'#e1e8ed'}))line.setAttribute(k,val);$('grid').append(line);let t=document.createElementNS(ns,'text');t.setAttribute('x',55);t.setAttribute('y',y(v)+4);t.setAttribute('text-anchor','end');t.textContent=fmt(v);$('grid').append(t);}
for(let i of [0,6,12,18,23].filter(i=>i<rows.length)){let t=document.createElementNS('http://www.w3.org/2000/svg','text');t.setAttribute('x',x(i));t.setAttribute('y',255);t.setAttribute('text-anchor','middle');t.textContent=rows[i].hour;$('grid').append(t);}
function render(){let r=rows[at];$('range').value=at;$('range').setAttribute('aria-valuetext',r.hour);$('time').textContent=r.hour;for(let [key,p,c]of[['f','fp','fc'],['a','ap','ac']]){$(p).setAttribute('d',path(key,at));$(c).setAttribute('cx',x(at));$(c).setAttribute('cy',y(r[key]));}$('cursor').setAttribute('x1',x(at));$('cursor').setAttribute('x2',x(at));$('fv').textContent=fmt(r.f)+' '+data.unit;$('av').textContent=fmt(r.a)+' '+data.unit;$('dv').textContent=fmt(r.f-r.a)+' '+data.unit;$('decision').textContent=data.kind==='revenue'?'여기는 각 조건에서 계산한 누적 계획 수익입니다. 두 금액의 차이는 실제 손실이 아닙니다.':(r.f>=r.a?'예측이 실제보다 '+fmt(r.f-r.a)+' '+data.unit+' 높았습니다.':'예측이 실제보다 '+fmt(r.a-r.f)+' '+data.unit+' 낮았습니다.');}
function stop(){clearInterval(timer);timer=null;$('play').textContent='▶ 비교 재생';$('play').setAttribute('aria-label','비교 재생');}function play(){if(at===rows.length-1)at=0;clearInterval(timer);$('play').textContent='Ⅱ 일시정지';$('play').setAttribute('aria-label','비교 일시정지');timer=setInterval(()=>{if(at===rows.length-1){stop();return;}at++;render();},Number($('speed').value));render();}
$('play').onclick=()=>timer?stop():play();$('prev').onclick=()=>{stop();at=Math.max(0,at-1);render();};$('next').onclick=()=>{stop();at=Math.min(rows.length-1,at+1);render();};$('range').oninput=()=>{stop();at=Number($('range').value);render();};$('speed').onchange=()=>{if(timer)play();};document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();});render();
</script></html>
