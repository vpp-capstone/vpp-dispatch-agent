# 대시보드 자동 계산 설정. 팀 Drive 에서 받은 예측 결과 파일이 아래 경로에 있으면 된다.
# 파일 내용·ESS·REC 설정·최적화 코드가 바뀌었을 때만 MILP(비교 백테스트 + 48시간 운영계획)를
# 다시 푼다. 모델 학습·추론, 다운로드, Git 커밋·푸시는 하지 않는다.
auto_refresh: true
poll_seconds: 30
ess: config/ess_v0_1.yaml
rec: config/rec_v0.yaml # 비우면 REC 미적용
plants: data/reference/plant_location_master_21.csv
# 발전량 담당 공유 parquet (improved_generation_kwh 열이 있으면 그 열을, 없으면 lightgbm 열을 쓴다)
# 데이터 묶음: 묶음마다 MILP·실행 결과를 따로 계산해 두고 화면 사이드바에서 골라 본다.
# 첫 묶음이 기본. 파일이 없는 묶음은 그 묶음만 '파일 대기'가 되고 나머지는 그대로 보인다.
datasets:
  - name: 2025 최종 평가 (improved, 실측 포함)
    solar: artifacts/2025/evaluation/solar_improved_2025_with_actual.parquet
    wind: artifacts/2025/evaluation/wind_improved_2025_with_actual.parquet
    smp: data/processed/forecast/smp_forecast.csv
  - name: 2025 운영 입력 (실측 제외)
    solar: artifacts/2025/operational/solar_improved_predictions.parquet
    wind: artifacts/2025/operational/wind_improved_predictions.parquet
    smp: data/processed/forecast/smp_forecast.csv
  - name: 2024 개선 검증 (실측 포함)
    solar: artifacts/2024_validation/solar_improved_2024_validation_with_actual.parquet
    wind: artifacts/2024_validation/wind_improved_2024_validation_with_actual.parquet
    smp: data/processed/forecast/smp_forecast.csv
# 아래 상위 경로는 datasets 가 없을 때의 묶음 하나 (호환용)
solar: artifacts/2025/evaluation/solar_improved_2025_with_actual.parquet
wind: artifacts/2025/evaluation/wind_improved_2025_with_actual.parquet
# SMP 담당 공유 csv
smp: data/processed/forecast/smp_forecast.csv
output: data/processed/operator_pipeline
