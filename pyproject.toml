[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vpp-dispatch-agent"
version = "0.3.0"
description = "제주 VPP: 다음 날 시간별 수요예측 → ESS 운영계획 → 운영비용 평가"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "streamlit>=1.36",
    "plotly>=5.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vpp", "api"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "api", "dashboard", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
